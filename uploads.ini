; ============================================================================
; PHP Upload Configuration for FlexOrder WordPress Container
; ============================================================================
; This file is mounted to /usr/local/etc/php/conf.d/uploads.ini in the
; WordPress container to allow larger file uploads and longer execution times

; Maximum file upload size (for plugin uploads and media files)
upload_max_filesize = 64M

; Maximum POST data size (must be larger than upload_max_filesize)
post_max_size = 64M

; Maximum script execution time in seconds
max_execution_time = 300

; Maximum time in seconds a script can parse input data
max_input_time = 300

; Maximum memory limit for PHP scripts
memory_limit = 512M

; Maximum number of files that can be uploaded in a single request
max_file_uploads = 20

