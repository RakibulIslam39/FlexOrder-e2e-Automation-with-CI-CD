  # ============================================================================
  # CLEANUP JOB
  # ============================================================================

  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [setup-wordpress]
    if: always()

    steps:
      - name: 📥 Checkout (for docker-compose file)
        uses: actions/checkout@v4

      - name: 🧹 Stop and Remove Docker Resources
        shell: powershell
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "🧹 Cleaning Up Docker Resources" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host ""

          # Stop and remove containers
          Write-Host "🛑 Stopping containers..." -ForegroundColor Yellow
          $containers = @('flexorder-wordpress', 'flexorder-mysql', 'flexorder-phpmyadmin', 'flexorder-mailhog')
          foreach ($container in $containers) {
            try {
              docker stop $container 2>$null | Out-Null
              docker rm -f $container 2>$null | Out-Null
              Write-Host "   OK Removed: $container" -ForegroundColor Green
            } catch {
              Write-Host "   • Skipped: $container (not found)" -ForegroundColor Gray
            }
          }

          Write-Host ""

          # Remove networks
          Write-Host "🌐 Removing networks..." -ForegroundColor Yellow
          try {
            docker network rm flexorder-ci-workflow_flexorder-network 2>$null | Out-Null
            Write-Host "   OK Network removed" -ForegroundColor Green
          } catch {
            Write-Host "   • Network not found (skipped)" -ForegroundColor Gray
          }

          Write-Host ""

          # Remove volumes
          Write-Host "💾 Removing volumes..." -ForegroundColor Yellow
          $volumes = @('flexorder-ci-workflow_wordpress_data', 'flexorder-ci-workflow_mysql_data')
          foreach ($volume in $volumes) {
            try {
              docker volume rm $volume 2>$null | Out-Null
              Write-Host "   OK Removed: $volume" -ForegroundColor Green
            } catch {
              Write-Host "   • Skipped: $volume (not found)" -ForegroundColor Gray
            }
          }

          Write-Host ""

          # Docker Compose cleanup
          Write-Host "🐳 Running docker-compose cleanup..." -ForegroundColor Yellow
          if (Test-Path "docker-compose.fresh-wordpress.yml") {
            docker compose -f docker-compose.fresh-wordpress.yml down -v --remove-orphans 2>$null | Out-Null
            Write-Host "   OK Compose cleanup completed" -ForegroundColor Green
          } else {
            Write-Host "   • Compose file not found (skipped)" -ForegroundColor Gray
          }

          Write-Host ""

          # Scoped cleanup only — must not wipe other repos' state on the
          # shared self-hosted runner. Project volumes were already removed
          # above via the explicit volume list.
          Write-Host "🗑️  Pruning FlexOrder-scoped images/build cache..." -ForegroundColor Yellow
          docker image prune -f --filter "label=com.docker.compose.project=flexorder-ci-workflow" 2>$null | Out-Null
          docker builder prune -f --keep-storage 5GB 2>$null | Out-Null
          Write-Host "   OK Scoped cleanup completed" -ForegroundColor Green

          Write-Host ""
          Write-Host "✅ Docker cleanup completed successfully!" -ForegroundColor Green
          Write-Host ""

      - name: 📊 Display Cleanup Summary
        shell: powershell
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "[Stats] Cleanup Summary" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Docker Status:" -ForegroundColor Yellow

          # Show remaining containers (should be none)
          $containers = docker ps -a --filter "name=flexorder" --format "{{.Names}}" 2>$null
          if ($containers) {
            Write-Host "   ⚠️  Remaining containers: $containers" -ForegroundColor Yellow
          } else {
            Write-Host "   ✅ No FlexOrder containers remaining" -ForegroundColor Green
          }

          # Show remaining volumes (should be none)
          $volumes = docker volume ls --filter "name=flexorder-ci-workflow" --format "{{.Name}}" 2>$null
          if ($volumes) {
            Write-Host "   ⚠️  Remaining volumes: $volumes" -ForegroundColor Yellow
          } else {
            Write-Host "   ✅ No FlexOrder volumes remaining" -ForegroundColor Green
          }

          # Show remaining networks (should be none)
          $networks = docker network ls --filter "name=flexorder-ci-workflow" --format "{{.Name}}" 2>$null
          if ($networks) {
            Write-Host "   ⚠️  Remaining networks: $networks" -ForegroundColor Yellow
          } else {
            Write-Host "   ✅ No FlexOrder networks remaining" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "✅ Cleanup job completed!" -ForegroundColor Green
          Write-Host ""
